name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint & format
        run: pnpm exec biome check src

      - name: Build
        run: pnpm build

  publish-npm:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: npm publish --access public --provenance

  publish-gh-extension:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Build binaries
        run: bash scripts/build-gh-extension.sh

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^v${VERSION}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          section() {
            local title=$1 pattern=$2
            local lines
            lines=$(git log "$RANGE" --format="- %s" -E --grep="^${pattern}" \
              | sed -E "s/^- [a-z]+(\(.+\))?!?: //")
            if [ -n "$lines" ]; then
              printf "## %s\n%s\n\n" "$title" "$lines"
            fi
          }

          {
            section "🚀 Features"      "feat"
            section "🐛 Bug Fixes"     "fix"
            section "📚 Documentation" "docs"
            section "🔧 Maintenance"   "(chore|ci)"
          } > body.md

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat body.md      >> "$GITHUB_OUTPUT"
          echo "EOF"       >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          files: |
            gh-prs-linux-amd64
            gh-prs-linux-arm64
            gh-prs-darwin-amd64
            gh-prs-darwin-arm64
            gh-prs-windows-amd64.exe
            gh-prs
